name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet build -c Release
      - run: dotnet run -c Release --no-build --project tests/Keel.Endpoints.Tests
      - run: dotnet pack -c Release --no-build -o artifacts
      - uses: actions/upload-artifact@v4
        with:
          name: packages
          path: artifacts/*

  native-aot:
    # Publishes samples/Keel.AotSample with Native AOT (any trimming or AOT warning fails the build),
    # runs the native binary and calls each endpoint.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: bash eng/aot-smoke.sh linux-x64

  templates:
    # Packs and installs the dotnet new templates, creates an API with keel-api and slices with
    # keel-slice, builds and calls it, then publishes the keel-api --aot variant natively and calls it.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: bash eng/template-smoke.sh linux-x64

  benchmarks:
    # Keeps the benchmark building and running. Shared runners are too noisy for the 5% check; see
    # benchmarks/Keel.Endpoints.Benchmarks/README.md.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet run -c Release --project benchmarks/Keel.Endpoints.Benchmarks -- --quick

  api-diff:
    # Comments the API changes of the sample on each pull request, with the tool built from this commit.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet build -c Release src/Keel.Endpoints.Tool
      - uses: ./actions/api-diff
        with:
          tool-command: dotnet run -c Release --no-build --project src/Keel.Endpoints.Tool --
